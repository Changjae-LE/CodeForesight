paths:
  cvefixes_db: data/raw/CVEfixes.db
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  artifacts_dir: artifacts
  repos_dir: repos

stage1:
  tools: [semgrep, osv-scanner, gitleaks, trivy]
  output_dir: artifacts/stage1
  semgrep_config: auto
  gitleaks_mode: dir
  fail_severities: [CRITICAL, HIGH]
  fail_on_secrets: true
  allow_missing_tools: false
  optional_terraform_validation: false

pattern_detector:
  language: null
  min_code_chars: 40
  max_code_chars: 30000
  max_samples_per_class: null
  classifier: logistic
  threshold: 0.70
  max_features: 50000

stage2:
  event_date: published_date
  start_month: 2018-01
  end_month: null
  forecast_horizon_months: 3
  lags: [1, 2, 3]
  rolling_window: 3
  min_repository_months: 24
  min_repository_cves: 3
  validation_months: 12
  test_months: 12
  ema_span: 6
  classifier_c_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  severity_alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0, 100000.0]
